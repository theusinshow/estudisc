name: Estudisc CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: estudisc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, unit, build]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run fast check
        run: |
          if [ "${{ matrix.check }}" = "unit" ]; then pnpm test:unit; else pnpm "${{ matrix.check }}"; fi
  content:
    name: ${{ matrix.check }}
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [integration, content-qa, pack-validation]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          if [ "${{ matrix.check }}" = "pack-validation" ]; then pnpm packs:verify; else pnpm "test:${{ matrix.check }}"; fi
  critical-e2e:
    name: critical-e2e
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: memory://local
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: estudisc-e2e-report
          path: |
            playwright-report/
            test-results/
