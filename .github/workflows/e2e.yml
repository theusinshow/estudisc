name: Estudisc Full E2E
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estudisc-full-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    name: full-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: memory://local
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: estudisc-full-e2e-report
          path: |
            playwright-report/
            test-results/
