<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="540" fill="#FFFCF5"/>
  <text x="24" y="44" font-size="26" font-weight="800" fill="#17141F">Interrogue a fonte</text>
  <text x="24" y="74" font-size="18" font-weight="700" fill="#5E5868">Carta fictícia de 1860: o diretor de uma</text>
  <text x="24" y="98" font-size="18" font-weight="700" fill="#5E5868">colônia escreve ao governo.</text>
  <g stroke="#17141F" stroke-width="3">
    <rect x="24" y="118" width="200" height="70" rx="12" fill="#FFD43B"/>
    <rect x="24" y="200" width="200" height="70" rx="12" fill="#8FDCFF"/>
    <rect x="24" y="282" width="200" height="70" rx="12" fill="#B69CFF"/>
    <rect x="24" y="364" width="200" height="70" rx="12" fill="#FFA552"/>
    <rect x="24" y="446" width="200" height="70" rx="12" fill="#C8321F"/>
  </g>
  <g font-size="20" font-weight="800" fill="#17141F">
    <text x="40" y="160">Quem produziu?</text>
    <text x="40" y="242">Quando?</text>
    <text x="40" y="324">Para quem?</text>
    <text x="40" y="406">Por quê?</text>
    <text x="40" y="477" fill="#FFFCF5">O que ela</text><text x="40" y="503" fill="#FFFCF5">pode calar?</text>
  </g>
  <g font-size="18" font-weight="700" fill="#17141F">
    <text x="240" y="160">O diretor da colônia.</text>
    <text x="240" y="242">Em 1860.</text>
    <text x="240" y="312">O governo, que financiava</text><text x="240" y="338">a colônia.</text>
    <text x="240" y="394">Pedir verbas e mostrar</text><text x="240" y="420">bom trabalho.</text>
    <text x="240" y="476">Problemas da colônia. Compare</text><text x="240" y="502">com cartas de colonos.</text>
  </g>
</svg>
