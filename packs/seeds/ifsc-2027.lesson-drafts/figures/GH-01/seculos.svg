<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="400" fill="#FFFCF5"/>
  <text x="24" y="44" font-size="26" font-weight="800" fill="#17141F">Em que século?</text>
  <rect x="40" y="70" width="186.7" height="74" fill="#8FDCFF" stroke="#17141F" stroke-width="3"/>
  <rect x="226.7" y="70" width="186.7" height="74" fill="#FFD43B" stroke="#17141F" stroke-width="3"/>
  <rect x="413.3" y="70" width="186.7" height="74" fill="#B69CFF" stroke="#17141F" stroke-width="3"/>
  <g fill="#17141F" text-anchor="middle">
    <text x="133.3" y="100" font-size="19" font-weight="800">Século XVIII</text><text x="133.3" y="128" font-size="17" font-weight="700">1701 a 1800</text>
    <text x="320" y="100" font-size="19" font-weight="800">Século XIX</text><text x="320" y="128" font-size="17" font-weight="700">1801 a 1900</text>
    <text x="506.7" y="100" font-size="19" font-weight="800">Século XX</text><text x="506.7" y="128" font-size="17" font-weight="700">1901 a 2000</text>
  </g>
  <line x1="40" y1="190" x2="600" y2="190" stroke="#17141F" stroke-width="3"/>
  <g stroke="#17141F" stroke-width="3"><line x1="40" y1="180" x2="40" y2="200"/><line x1="226.7" y1="180" x2="226.7" y2="200"/><line x1="413.3" y1="180" x2="413.3" y2="200"/><line x1="600" y1="180" x2="600" y2="200"/></g>
  <g stroke="#17141F" stroke-width="2" stroke-dasharray="5 4">
    <line x1="128.7" y1="144" x2="128.7" y2="190"/><line x1="319.1" y1="144" x2="319.1" y2="190"/>
  </g>
  <g fill="#C8321F" stroke="#17141F" stroke-width="2">
    <circle cx="128.7" cy="190" r="8"/><circle cx="319.1" cy="190" r="8"/><circle cx="390" cy="190" r="8"/><circle cx="411.5" cy="190" r="6"/>
  </g>
  <g font-size="19" font-weight="800" fill="#17141F">
    <text x="128.7" y="228" text-anchor="middle">1748</text>
    <text x="319.1" y="228" text-anchor="middle">1850</text>
    <line x1="390" y1="198" x2="390" y2="210" stroke="#17141F" stroke-width="2"/><text x="390" y="230" text-anchor="middle">1888</text>
    <line x1="411.5" y1="166" x2="411.5" y2="184" stroke="#17141F" stroke-width="2"/><text x="404" y="172" text-anchor="end">1900</text>
  </g>
  <rect x="24" y="300" width="592" height="80" rx="12" fill="#FFFCF5" stroke="#C8321F" stroke-width="3"/>
  <text x="40" y="332" font-size="20" font-weight="800" fill="#C8321F">1900 ainda é século XIX.</text>
  <text x="40" y="362" font-size="18" font-weight="700" fill="#17141F">O século XX só começa em 1901.</text>
</svg>
