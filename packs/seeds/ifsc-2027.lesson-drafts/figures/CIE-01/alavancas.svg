  <text x="32" y="392" font-size="22" font-weight="800" fill="#17141F">Interpotente: força no meio</text>
  <text x="32" y="426" font-size="17" font-weight="600" fill="#5E5868">pinça, vara de pescar</text>
  <line x1="300" y1="430" x2="600" y2="430" stroke="#17141F" stroke-width="7"/>
  <polygon points="310,434 330,466 290,466" fill="#FFD43B" stroke="#17141F" stroke-width="3"/>
