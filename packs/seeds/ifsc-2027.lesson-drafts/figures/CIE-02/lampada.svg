<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="420" fill="#FFFCF5"/>
  <text x="32" y="40" font-size="24" font-weight="800" fill="#17141F">Uma lâmpada, a cada segundo</text>
  <rect x="32" y="120" width="218" height="180" fill="#FFA552" stroke="#17141F" stroke-width="3"/>
  <text x="138" y="186" font-size="22" font-weight="800" fill="#17141F" text-anchor="middle">Elétrica</text>
  <text x="138" y="220" font-size="30" font-weight="800" fill="#17141F" text-anchor="middle">60 J</text>
  <text x="138" y="250" font-size="18" font-weight="700" fill="#17141F" text-anchor="middle">recebida</text>
  <polygon points="250,120 410,64 410,54 444,73 410,92 410,82 250,138" fill="#FFD43B" stroke="#17141F" stroke-width="3" stroke-linejoin="round"/>
  <text x="458" y="72" font-size="22" font-weight="800" fill="#17141F">Luz: 6 J</text>
  <text x="458" y="98" font-size="18" font-weight="700" fill="#14804A">energia útil</text>
  <polygon points="250,138 410,138 410,124 470,219 410,314 410,300 250,300" fill="#C8321F" stroke="#17141F" stroke-width="3" stroke-linejoin="round"/>
  <text x="334" y="214" font-size="22" font-weight="800" fill="#FFFCF5" text-anchor="middle">Calor</text>
  <text x="334" y="246" font-size="28" font-weight="800" fill="#FFFCF5" text-anchor="middle">54 J</text>
  <text x="482" y="212" font-size="18" font-weight="700" fill="#C8321F">dissipada:</text>
  <text x="482" y="236" font-size="18" font-weight="700" fill="#C8321F">não some</text>
  <text x="32" y="354" font-size="22" font-weight="800" fill="#17141F">60 J = 6 J de luz + 54 J de calor</text>
  <text x="32" y="392" font-size="22" font-weight="800" fill="#14804A">Rendimento: 6 ÷ 60 = 0,1 = 10%</text>
</svg>
