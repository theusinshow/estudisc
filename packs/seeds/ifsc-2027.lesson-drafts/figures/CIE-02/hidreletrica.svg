<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="590" fill="#FFFCF5"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17141F"/></marker></defs>
  <text x="32" y="42" font-size="24" font-weight="800" fill="#17141F">Da represa ao banho quente</text>
  <rect x="24" y="64" width="592" height="80" fill="#FFFCF5" stroke="#17141F" stroke-width="3"/>
  <rect x="24" y="64" width="100" height="80" fill="#8FDCFF" stroke="#17141F" stroke-width="3"/>
  <path d="M34,88 q7,-7 14,0 t14,0 t14,0 t14,0" fill="none" stroke="#17141F" stroke-width="3"/>
  <polygon points="92,76 102,76 114,136 92,136" fill="#17141F"/>
  <text x="146" y="98" font-size="24" font-weight="800" fill="#17141F">Potencial gravitacional</text>
  <text x="146" y="128" font-size="18" font-weight="600" fill="#17141F">água parada no alto da represa</text>
  <line x1="74" y1="148" x2="74" y2="186" stroke="#17141F" stroke-width="5" marker-end="url(#a)"/>
  <text x="104" y="174" font-size="18" font-weight="700" fill="#14804A">a água desce pelos dutos</text>
  <rect x="24" y="192" width="592" height="80" fill="#FFFCF5" stroke="#17141F" stroke-width="3"/>
  <rect x="24" y="192" width="100" height="80" fill="#FFD43B" stroke="#17141F" stroke-width="3"/>
  <circle cx="74" cy="232" r="26" fill="#FFFCF5" stroke="#17141F" stroke-width="3"/>
  <g stroke="#17141F" stroke-width="5"><line x1="74" y1="210" x2="74" y2="254"/><line x1="52" y1="232" x2="96" y2="232"/></g>
  <circle cx="74" cy="232" r="6" fill="#17141F"/>
  <text x="146" y="226" font-size="24" font-weight="800" fill="#17141F">Cinética</text>
  <text x="146" y="256" font-size="18" font-weight="600" fill="#17141F">a água rápida gira a turbina</text>
  <line x1="74" y1="276" x2="74" y2="314" stroke="#17141F" stroke-width="5" marker-end="url(#a)"/>
  <text x="104" y="302" font-size="18" font-weight="700" fill="#14804A">a turbina gira o gerador</text>
  <rect x="24" y="320" width="592" height="80" fill="#FFFCF5" stroke="#17141F" stroke-width="3"/>
  <rect x="24" y="320" width="100" height="80" fill="#FFA552" stroke="#17141F" stroke-width="3"/>
  <polygon points="82,330 56,364 72,364 64,390 94,352 78,352 88,330" fill="#17141F"/>
  <text x="146" y="354" font-size="24" font-weight="800" fill="#17141F">Elétrica</text>
  <text x="146" y="384" font-size="18" font-weight="600" fill="#17141F">a corrente percorre os fios</text>
  <line x1="74" y1="404" x2="74" y2="442" stroke="#17141F" stroke-width="5" marker-end="url(#a)"/>
  <text x="104" y="430" font-size="18" font-weight="700" fill="#14804A">os fios chegam ao chuveiro</text>
  <rect x="24" y="448" width="592" height="80" fill="#FFFCF5" stroke="#17141F" stroke-width="3"/>
  <rect x="24" y="448" width="100" height="80" fill="#C8321F" stroke="#17141F" stroke-width="3"/>
  <path d="M48,472 L100,472 L92,484 L56,484 Z" fill="#FFFCF5"/>
  <g stroke="#FFFCF5" stroke-width="4" stroke-linecap="round"><line x1="62" y1="494" x2="58" y2="512"/><line x1="74" y1="494" x2="74" y2="514"/><line x1="86" y1="494" x2="90" y2="512"/></g>
  <text x="146" y="482" font-size="24" font-weight="800" fill="#17141F">Térmica</text>
  <text x="146" y="512" font-size="18" font-weight="600" fill="#17141F">o chuveiro esquenta a água</text>
  <text x="32" y="560" font-size="19" font-weight="800" fill="#17141F">Nada foi criado: a energia só mudou de forma.</text>
  <text x="32" y="584" font-size="17" font-weight="600" fill="#5E5868">Em cada etapa, uma parte vira calor e som.</text>
</svg>
