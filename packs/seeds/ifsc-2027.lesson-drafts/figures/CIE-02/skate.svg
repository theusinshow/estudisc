<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="440" fill="#FFFCF5"/>
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#14804A"/></marker></defs>
  <text x="32" y="38" font-size="24" font-weight="800" fill="#17141F">Skate na pista em U</text>
  <path d="M20,120 L40,120 Q40,320 220,320 L420,320 Q600,320 600,120 L620,120 L620,356 L20,356 Z" fill="#FFD43B" stroke="#17141F" stroke-width="4" stroke-linejoin="round"/>
  <line x1="56" y1="140" x2="604" y2="140" stroke="#17141F" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="320" y="130" font-size="17" font-weight="700" fill="#5E5868" text-anchor="middle">altura de partida</text>
  <line x1="250" y1="338" x2="390" y2="338" stroke="#14804A" stroke-width="6" marker-end="url(#g)"/>
  <circle cx="56" cy="140" r="14" fill="#C8321F" stroke="#17141F" stroke-width="3"/>
  <circle cx="320" cy="306" r="14" fill="#C8321F" stroke="#17141F" stroke-width="3"/>
  <circle cx="580" cy="175" r="14" fill="#C8321F" stroke="#17141F" stroke-width="3"/>
  <text x="80" y="76" font-size="19" font-weight="800" fill="#17141F">A: alto e parado</text>
  <text x="80" y="100" font-size="18" font-weight="700" fill="#17141F">potencial máxima</text>
  <text x="320" y="252" font-size="19" font-weight="800" fill="#17141F" text-anchor="middle">B: embaixo e rápido</text>
  <text x="320" y="276" font-size="18" font-weight="700" fill="#17141F" text-anchor="middle">cinética máxima</text>
  <text x="554" y="180" font-size="19" font-weight="800" fill="#17141F" text-anchor="end">C: sobe menos</text>
  <text x="554" y="204" font-size="18" font-weight="700" fill="#17141F" text-anchor="end">parte virou calor e som</text>
  <text x="32" y="394" font-size="19" font-weight="700" fill="#17141F">Descendo: potencial → cinética.</text>
  <text x="32" y="424" font-size="19" font-weight="700" fill="#17141F">Subindo: cinética → potencial.</text>
</svg>
