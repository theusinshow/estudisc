<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="520" fill="#FFFCF5"/>
  <text x="32" y="46" font-size="24" font-weight="800" fill="#17141F">Três tipos de afirmação sobre um texto</text>
  <text x="32" y="78" font-size="18" font-weight="600" fill="#5E5868">Texto: Lia fechou o guarda-chuva e deixou o casaco molhado.</text>
  <rect x="32" y="104" width="576" height="116" rx="16" fill="#C4F03A" stroke="#17141F" stroke-width="3"/>
  <text x="52" y="140" font-size="22" font-weight="800" fill="#17141F">Explícita: está escrito</text>
  <text x="52" y="172" font-size="19" font-weight="600" fill="#17141F">“Lia fechou o guarda-chuva.”</text>
  <text x="52" y="202" font-size="17" font-weight="600" fill="#17141F">Prova: a própria frase do texto.</text>
  <rect x="32" y="236" width="576" height="116" rx="16" fill="#FFD43B" stroke="#17141F" stroke-width="3"/>
  <text x="52" y="272" font-size="22" font-weight="800" fill="#17141F">Inferência sustentada: pista + conclusão</text>
  <text x="52" y="304" font-size="19" font-weight="600" fill="#17141F">“Lia provavelmente pegou chuva.”</text>
  <text x="52" y="334" font-size="17" font-weight="600" fill="#17141F">Prova: guarda-chuva e casaco molhado.</text>
  <rect x="32" y="368" width="576" height="116" rx="16" fill="#FF8FC8" stroke="#17141F" stroke-width="3"/>
  <text x="52" y="404" font-size="22" font-weight="800" fill="#17141F">Sem apoio: vem de fora do texto</text>
  <text x="52" y="436" font-size="19" font-weight="600" fill="#17141F">“Lia mora longe da biblioteca.”</text>
  <text x="52" y="466" font-size="17" font-weight="600" fill="#17141F">Prova: nenhuma; o texto não diz isso.</text>
</svg>
