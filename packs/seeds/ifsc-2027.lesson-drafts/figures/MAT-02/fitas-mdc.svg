<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="410" fill="#FFFCF5"/>
  <text x="32" y="44" font-size="26" font-weight="800" fill="#17141F">Pedaços de 30 cm, sem sobra</text>
  <text x="80" y="94" font-size="20" font-weight="800" fill="#17141F">Fita de 90 cm: 3 pedaços</text>
  <rect x="80" y="108" width="360" height="48" fill="#FFD43B" stroke="#17141F" stroke-width="3"/>
  <text x="80" y="200" font-size="20" font-weight="800" fill="#17141F">Fita de 120 cm: 4 pedaços</text>
  <rect x="80" y="214" width="480" height="48" fill="#FFD43B" stroke="#17141F" stroke-width="3"/>
