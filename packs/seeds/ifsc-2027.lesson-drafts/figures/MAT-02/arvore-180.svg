<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="510" fill="#FFFCF5"/>
  <text x="32" y="44" font-size="26" font-weight="800" fill="#17141F">Árvore de fatores do 180</text>
  <g transform="translate(0,16)">
  <g stroke="#17141F" stroke-width="3">
    <line x1="140" y1="98" x2="100" y2="132"/><line x1="160" y1="98" x2="200" y2="134"/>
    <line x1="200" y1="178" x2="160" y2="212"/><line x1="220" y1="178" x2="260" y2="214"/>
    <line x1="260" y1="258" x2="220" y2="292"/><line x1="280" y1="258" x2="320" y2="294"/>
    <line x1="320" y1="338" x2="280" y2="372"/><line x1="340" y1="338" x2="380" y2="372"/>
  </g>
  <g stroke="#17141F" stroke-width="3" fill="#FFFCF5">
    <rect x="110" y="54" width="80" height="44" rx="10"/>
    <rect x="175" y="134" width="70" height="44" rx="10"/>
    <rect x="235" y="214" width="70" height="44" rx="10"/>
    <rect x="295" y="294" width="70" height="44" rx="10"/>
  </g>
  <g stroke="#17141F" stroke-width="3" fill="#FFD43B">
    <circle cx="90" cy="156" r="24"/><circle cx="150" cy="236" r="24"/><circle cx="210" cy="316" r="24"/><circle cx="270" cy="396" r="24"/><circle cx="390" cy="396" r="24"/>
  </g>
  <g font-size="26" font-weight="800" fill="#17141F" text-anchor="middle">
    <text x="150" y="85">180</text>
    <text x="90" y="165">2</text><text x="210" y="165">90</text>
    <text x="150" y="245">2</text><text x="270" y="245">45</text>
    <text x="210" y="325">3</text><text x="330" y="325">15</text>
    <text x="270" y="405">3</text><text x="390" y="405">5</text>
  </g>
  </g>
  <text x="380" y="112" font-size="20" font-weight="700" fill="#17141F">Fatores primos:</text>
  <text x="380" y="150" font-size="24" font-weight="800" fill="#17141F">2 × 2 × 3 × 3 × 5</text>
  <text x="380" y="190" font-size="24" font-weight="800" fill="#14804A">= 2² × 3² × 5</text>
  <text x="380" y="228" font-size="18" font-weight="700" fill="#17141F">4 × 9 × 5 = 180</text>
  <circle cx="50" cy="480" r="14" fill="#FFD43B" stroke="#17141F" stroke-width="2.5"/>
  <text x="74" y="487" font-size="18" font-weight="700" fill="#17141F">primo: o galho para</text>
  <rect x="300" y="466" width="40" height="28" rx="8" fill="#FFFCF5" stroke="#17141F" stroke-width="2.5"/>
  <text x="352" y="487" font-size="18" font-weight="700" fill="#17141F">composto: ainda divide</text>
</svg>
