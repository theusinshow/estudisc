<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="540" fill="#FFFCF5"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17141F"/></marker></defs>
  <rect x="16" y="24" width="280" height="90" rx="14" fill="#8FDCFF" stroke="#17141F" stroke-width="3"/>
  <text x="156" y="60" font-size="21" font-weight="800" fill="#17141F" text-anchor="middle">Quem escreve?</text>
  <text x="156" y="92" font-size="20" font-weight="700" fill="#17141F" text-anchor="middle">a avó</text>
  <rect x="344" y="24" width="280" height="90" rx="14" fill="#B69CFF" stroke="#17141F" stroke-width="3"/>
  <text x="484" y="60" font-size="21" font-weight="800" fill="#17141F" text-anchor="middle">Para quem?</text>
  <text x="484" y="92" font-size="20" font-weight="700" fill="#17141F" text-anchor="middle">Pedro</text>
  <rect x="16" y="206" width="174" height="128" rx="14" fill="#FFA552" stroke="#17141F" stroke-width="3"/>
  <text x="103" y="254" font-size="20" font-weight="800" fill="#17141F" text-anchor="middle">Onde?</text>
  <text x="103" y="284" font-size="19" font-weight="700" fill="#17141F" text-anchor="middle">em casa,</text>
  <text x="103" y="308" font-size="19" font-weight="700" fill="#17141F" text-anchor="middle">para ler depois</text>
  <rect x="450" y="206" width="174" height="128" rx="14" fill="#FF8FC8" stroke="#17141F" stroke-width="3"/>
  <text x="537" y="254" font-size="20" font-weight="800" fill="#17141F" text-anchor="middle">Quando?</text>
  <text x="537" y="284" font-size="19" font-weight="700" fill="#17141F" text-anchor="middle">antes de o</text>
  <text x="537" y="308" font-size="19" font-weight="700" fill="#17141F" text-anchor="middle">gás chegar</text>
  <rect x="236" y="220" width="168" height="100" rx="14" fill="#FFD43B" stroke="#17141F" stroke-width="4"/>
  <text x="320" y="262" font-size="24" font-weight="800" fill="#17141F" text-anchor="middle">TEXTO</text>
  <text x="320" y="292" font-size="19" font-weight="700" fill="#17141F" text-anchor="middle">o bilhete</text>
  <line x1="290" y1="216" x2="200" y2="122" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="350" y1="216" x2="440" y2="122" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="232" y1="270" x2="198" y2="270" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="408" y1="270" x2="442" y2="270" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="320" y1="324" x2="320" y2="412" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <rect x="96" y="420" width="448" height="96" rx="14" fill="#FFFCF5" stroke="#14804A" stroke-width="4"/>
  <text x="320" y="458" font-size="21" font-weight="800" fill="#14804A" text-anchor="middle">Para quê?</text>
  <text x="320" y="490" font-size="20" font-weight="700" fill="#17141F" text-anchor="middle">dizer onde está o dinheiro do gás</text>
</svg>
