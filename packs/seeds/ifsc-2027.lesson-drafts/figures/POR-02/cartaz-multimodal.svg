<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Archivo, Arial, Helvetica, sans-serif">
  <rect width="640" height="470" fill="#FFFCF5"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#17141F"/></marker></defs>
  <rect x="30" y="30" width="290" height="410" rx="10" fill="#FFD43B" stroke="#17141F" stroke-width="4"/>
  <text x="175" y="98" font-size="38" font-weight="800" fill="#17141F" text-anchor="middle">Feche bem.</text>
  <rect x="96" y="158" width="64" height="12" rx="4" fill="#17141F"/>
  <rect x="120" y="170" width="16" height="26" fill="#17141F"/>
  <rect x="30" y="196" width="190" height="34" fill="#FFFCF5" stroke="#17141F" stroke-width="4"/>
  <rect x="186" y="228" width="34" height="38" fill="#FFFCF5" stroke="#17141F" stroke-width="4"/>
  <path d="M203,288 C192,304 192,318 203,318 C214,318 214,304 203,288 Z" fill="#8FDCFF" stroke="#17141F" stroke-width="3"/>
  <path d="M203,336 C195,348 195,358 203,358 C211,358 211,348 203,336 Z" fill="#8FDCFF" stroke="#17141F" stroke-width="3"/>
  <ellipse cx="203" cy="408" rx="58" ry="12" fill="#8FDCFF" stroke="#17141F" stroke-width="3"/>
  <line x1="352" y1="84" x2="326" y2="84" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <text x="360" y="72" font-size="20" font-weight="800" fill="#17141F">Só a frase:</text>
  <text x="360" y="98" font-size="20" font-weight="700" fill="#C8321F">feche o quê?</text>
  <line x1="352" y1="232" x2="240" y2="232" stroke="#17141F" stroke-width="4" marker-end="url(#arr)"/>
  <text x="360" y="222" font-size="20" font-weight="800" fill="#17141F">Só a imagem:</text>
  <text x="360" y="248" font-size="20" font-weight="700" fill="#C8321F">torneira pingando</text>
  <rect x="344" y="320" width="282" height="120" rx="14" fill="#FFFCF5" stroke="#14804A" stroke-width="4"/>
  <text x="360" y="354" font-size="20" font-weight="800" fill="#14804A">Juntas:</text>
  <text x="360" y="382" font-size="20" font-weight="700" fill="#17141F">feche bem a torneira</text>
  <text x="360" y="410" font-size="20" font-weight="700" fill="#17141F">e não desperdice água.</text>
</svg>
