<svg xmlns="http://www.w3.org/2000/svg" width="390" height="200" viewBox="0 0 390 200" role="img" aria-labelledby="title desc">
  <title id="title">Três décimos de uma barra</title>
  <desc id="desc">Dez partes iguais, três destacadas. Três décimos equivalem a 0,3 e a 30%.</desc>
  <rect width="390" height="200" fill="#FFFCF5"/>
  <g fill="#17141F" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="195" y="35" font-size="24" font-weight="700">3 de 10 partes iguais</text>
    <rect x="25" y="58" width="102" height="58" fill="#FFD43B"/>
    <rect x="25" y="58" width="340" height="58" fill="none" stroke="#17141F" stroke-width="3"/>
    <path d="M59 58V116 M93 58V116 M127 58V116 M161 58V116 M195 58V116 M229 58V116 M263 58V116 M297 58V116 M331 58V116" fill="none" stroke="#17141F" stroke-width="2"/>
    <text x="195" y="155" font-size="28" font-weight="700">3/10 = 0,3 = 30%</text>
    <text x="195" y="184" font-size="20">O retângulo inteiro é o todo.</text>
  </g>
</svg>
