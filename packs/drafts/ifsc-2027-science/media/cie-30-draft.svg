<svg xmlns="http://www.w3.org/2000/svg" width="360" height="561" viewBox="0 0 360 561" role="img" aria-labelledby="title description"><title id="title">Vacinas, imunidade e doenças dos sistemas</title><desc id="description">Vacinas, imunidade e doenças dos sistemas
Vacina → antígeno → resposta
Vacinas apresentam antígenos ou instruções que induzem uma resposta imunológica específica sem causar a doença da mesma forma que uma infecção natural típica.
Células de memória → resposta futura
A resposta adaptativa pode gerar células de memória, permitindo resposta mais rápida em exposições futuras.</desc><rect width="360" height="561" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Vacinas, imunidade e</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">doenças dos sistemas</text><rect x="12" y="99" width="336" height="208" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Vacina → antígeno → resposta</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Vacinas apresentam antígenos</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ou instruções que induzem uma</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">resposta imunológica</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">específica sem causar a doença</text><text x="26" y="259" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">da mesma forma que uma</text><text x="26" y="283" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">infecção natural típica.</text><path d="M180 320v18m-6-6 6 6 6-6" fill="none" stroke="#102a43" stroke-width="2"/><rect x="12" y="349" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="382" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Células de memória → resposta</text><text x="26" y="406" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">futura</text><text x="26" y="437" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">A resposta adaptativa pode</text><text x="26" y="461" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">gerar células de memória,</text><text x="26" y="485" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">permitindo resposta mais</text><text x="26" y="509" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">rápida em exposições futuras.</text></svg>
