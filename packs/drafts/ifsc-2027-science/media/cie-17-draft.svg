<svg xmlns="http://www.w3.org/2000/svg" width="360" height="790" viewBox="0 0 360 790" role="img" aria-labelledby="title description"><title id="title">DNA, genes e cromossomos</title><desc id="description">DNA, genes e cromossomos
DNA
DNA é uma molécula que armazena informação genética por meio da sequência de seus nucleotídeos.
Gene
Gene é um segmento de DNA associado à produção de um produto funcional e à herança de características de modo frequentemente complexo.
Cromossomos
Cromossomos são estruturas formadas por DNA associado a proteínas; em células eucarióticas ficam no núcleo durante grande parte do ciclo celular.
Genes ocupam posições específicas nos cromossomos e podem apresentar versões chamadas alelos.</desc><rect width="360" height="790" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">DNA, genes e cromossomos</text><rect x="12" y="68" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="101" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">DNA</text><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">DNA é uma molécula que</text><text x="26" y="156" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">armazena informação genética</text><text x="26" y="180" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">por meio da sequência de seus</text><text x="26" y="204" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">nucleotídeos.</text><rect x="12" y="246" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="279" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Gene</text><text x="26" y="310" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Gene é um segmento de DNA</text><text x="26" y="334" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">associado à produção de um</text><text x="26" y="358" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">produto funcional e à herança</text><text x="26" y="382" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">de características de modo</text><text x="26" y="406" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">frequentemente complexo.</text><rect x="12" y="448" width="336" height="314" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="481" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Cromossomos</text><text x="26" y="512" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Cromossomos são estruturas</text><text x="26" y="536" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">formadas por DNA associado a</text><text x="26" y="560" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">proteínas; em células</text><text x="26" y="584" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">eucarióticas ficam no núcleo</text><text x="26" y="608" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">durante grande parte do ciclo</text><text x="26" y="632" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">celular.</text><text x="26" y="666" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Genes ocupam posições</text><text x="26" y="690" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">específicas nos cromossomos e</text><text x="26" y="714" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">podem apresentar versões</text><text x="26" y="738" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">chamadas alelos.</text></svg>
