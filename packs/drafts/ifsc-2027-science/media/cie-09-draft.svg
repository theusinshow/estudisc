<svg xmlns="http://www.w3.org/2000/svg" width="360" height="893" viewBox="0 0 360 893" role="img" aria-labelledby="title description"><title id="title">Modelos atômicos e partículas subatômicas</title><desc id="description">Modelos atômicos e partículas subatômicas
Dalton
Dalton descreveu átomos como unidades esféricas sem estrutura interna no modelo histórico correspondente.
Thomson
Thomson incorporou elétrons e mostrou que o átomo tinha estrutura interna.
Rutherford
Rutherford propôs um núcleo pequeno e positivo, com a maior parte do volume atômico sendo espaço ao redor do núcleo.
Bohr
No modelo de Bohr, elétrons ocupam níveis de energia definidos, uma simplificação útil no nível escolar.</desc><rect width="360" height="893" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Modelos atômicos e</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">partículas subatômicas</text><rect x="12" y="99" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Dalton</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Dalton descreveu átomos como</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">unidades esféricas sem</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">estrutura interna no modelo</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">histórico correspondente.</text><path d="M180 272v18m-6-6 6 6 6-6" fill="none" stroke="#102a43" stroke-width="2"/><rect x="12" y="301" width="336" height="136" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="334" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Thomson</text><text x="26" y="365" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Thomson incorporou elétrons e</text><text x="26" y="389" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">mostrou que o átomo tinha</text><text x="26" y="413" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">estrutura interna.</text><path d="M180 450v18m-6-6 6 6 6-6" fill="none" stroke="#102a43" stroke-width="2"/><rect x="12" y="479" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="512" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Rutherford</text><text x="26" y="543" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Rutherford propôs um núcleo</text><text x="26" y="567" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">pequeno e positivo, com a</text><text x="26" y="591" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">maior parte do volume atômico</text><text x="26" y="615" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">sendo espaço ao redor do</text><text x="26" y="639" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">núcleo.</text><path d="M180 676v18m-6-6 6 6 6-6" fill="none" stroke="#102a43" stroke-width="2"/><rect x="12" y="705" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="738" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Bohr</text><text x="26" y="769" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">No modelo de Bohr, elétrons</text><text x="26" y="793" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ocupam níveis de energia</text><text x="26" y="817" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">definidos, uma simplificação</text><text x="26" y="841" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">útil no nível escolar.</text></svg>
