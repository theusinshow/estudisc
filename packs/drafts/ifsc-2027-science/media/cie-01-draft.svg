<svg xmlns="http://www.w3.org/2000/svg" width="360" height="750" viewBox="0 0 360 750" role="img" aria-labelledby="title description"><title id="title">Trajetória × deslocamento</title><desc id="description">Trajetória × deslocamento
Início
Fim
trajetória
deslocamento
Desenho: um caminho curvo e tracejado vai do Início ao Fim; uma seta reta liga o Início ao Fim.
Trajetória
É o caminho que o corpo faz (linha tracejada).
Deslocamento
Liga a posição inicial à final em linha reta e tem sentido (seta).
Ida e volta
Quem anda 100 m e volta ao ponto de partida percorre 200 m, mas o deslocamento é zero.</desc><rect width="360" height="750" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Trajetória × deslocamento</text><path d="M50 228C80 78,170 68,210 138S285 218,310 228" fill="none" stroke="#102a43" stroke-width="3" stroke-dasharray="9 7"/><path d="M50 228H296" stroke="#b5482a" stroke-width="5"/><path d="M290 218L310 228L290 238Z" fill="#b5482a"/><circle cx="50" cy="228" r="7" fill="#102a43"/><circle cx="310" cy="228" r="7" fill="#102a43"/><text x="50" y="258" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="16" font-weight="700">Início</text><text x="310" y="258" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="16" font-weight="700">Fim</text><text x="268" y="118" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="16">trajetória</text><text x="180" y="216" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="16">deslocamento</text><rect x="12" y="278" width="336" height="112" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="311" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Trajetória</text><text x="26" y="342" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">É o caminho que o corpo faz</text><text x="26" y="366" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">(linha tracejada).</text><rect x="12" y="408" width="336" height="136" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="441" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Deslocamento</text><text x="26" y="472" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Liga a posição inicial à final</text><text x="26" y="496" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">em linha reta e tem sentido</text><text x="26" y="520" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">(seta).</text><rect x="12" y="562" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="595" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Ida e volta</text><text x="26" y="626" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Quem anda 100 m e volta ao</text><text x="26" y="650" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ponto de partida percorre</text><text x="26" y="674" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">200 m, mas o deslocamento é</text><text x="26" y="698" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">zero.</text></svg>
