<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1033" viewBox="0 0 360 1033" role="img" aria-labelledby="title description"><title id="title">Mitose, meiose e gametogênese</title><desc id="description">Mitose, meiose e gametogênese
Mitose
Mitose geralmente produz duas células-filhas geneticamente muito semelhantes à célula de origem, mantendo o número de cromossomos em organismos diploides.
Mitose participa de crescimento, renovação e reparo de tecidos.
Meiose
Meiose envolve duas divisões celulares e reduz pela metade o número de cromossomos, originando células haploides.
Meiose contribui para variabilidade genética por processos como recombinação e distribuição independente de cromossomos.
Gametogênese
Gametogênese é o processo de formação de gametas e envolve meiose em animais e outros eventos de diferenciação.
Na fecundação, a união de gametas restaura o número diploide característico da espécie em ciclos sexuais típicos.</desc><rect width="360" height="1033" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Mitose, meiose e</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">gametogênese</text><rect x="12" y="99" width="336" height="290" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Mitose</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Mitose geralmente produz duas</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">células-filhas geneticamente</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">muito semelhantes à célula de</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">origem, mantendo o número de</text><text x="26" y="259" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">cromossomos em organismos</text><text x="26" y="283" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">diploides.</text><text x="26" y="317" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Mitose participa de</text><text x="26" y="341" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">crescimento, renovação e</text><text x="26" y="365" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">reparo de tecidos.</text><rect x="12" y="407" width="336" height="290" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="440" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Meiose</text><text x="26" y="471" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Meiose envolve duas divisões</text><text x="26" y="495" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">celulares e reduz pela metade</text><text x="26" y="519" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">o número de cromossomos,</text><text x="26" y="543" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">originando células haploides.</text><text x="26" y="577" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Meiose contribui para</text><text x="26" y="601" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">variabilidade genética por</text><text x="26" y="625" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">processos como recombinação e</text><text x="26" y="649" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">distribuição independente de</text><text x="26" y="673" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">cromossomos.</text><rect x="12" y="715" width="336" height="290" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="748" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Gametogênese</text><text x="26" y="779" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Gametogênese é o processo de</text><text x="26" y="803" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">formação de gametas e envolve</text><text x="26" y="827" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">meiose em animais e outros</text><text x="26" y="851" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">eventos de diferenciação.</text><text x="26" y="885" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Na fecundação, a união de</text><text x="26" y="909" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">gametas restaura o número</text><text x="26" y="933" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">diploide característico da</text><text x="26" y="957" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">espécie em ciclos sexuais</text><text x="26" y="981" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">típicos.</text></svg>
