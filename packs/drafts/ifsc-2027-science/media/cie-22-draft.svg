<svg xmlns="http://www.w3.org/2000/svg" width="360" height="821" viewBox="0 0 360 821" role="img" aria-labelledby="title description"><title id="title">Efeito estufa, aquecimento global e camada de ozônio</title><desc id="description">Efeito estufa, aquecimento global e camada de ozônio
Efeito estufa
O efeito estufa natural ajuda a manter a Terra em temperatura compatível com a vida ao reter parte da radiação infravermelha emitida pela superfície.
O aumento de concentrações de gases de efeito estufa por atividades humanas intensifica o balanço radiativo e contribui para o aquecimento global.
Camada de ozônio
A camada de ozônio estratosférico absorve grande parte da radiação ultravioleta biologicamente danosa.
A destruição da camada de ozônio esteve ligada principalmente a substâncias destruidoras de ozônio, como CFCs; não é a mesma causa do aquecimento global.</desc><rect width="360" height="821" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Efeito estufa, aquecimento</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">global e camada de ozônio</text><rect x="12" y="99" width="336" height="362" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Efeito estufa</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">O efeito estufa natural ajuda</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">a manter a Terra em</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">temperatura compatível com a</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">vida ao reter parte da</text><text x="26" y="259" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">radiação infravermelha emitida</text><text x="26" y="283" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">pela superfície.</text><text x="26" y="317" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">O aumento de concentrações de</text><text x="26" y="341" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">gases de efeito estufa por</text><text x="26" y="365" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">atividades humanas intensifica</text><text x="26" y="389" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">o balanço radiativo e</text><text x="26" y="413" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">contribui para o aquecimento</text><text x="26" y="437" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">global.</text><rect x="12" y="479" width="336" height="314" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="512" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Camada de ozônio</text><text x="26" y="543" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">A camada de ozônio</text><text x="26" y="567" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">estratosférico absorve grande</text><text x="26" y="591" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">parte da radiação ultravioleta</text><text x="26" y="615" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">biologicamente danosa.</text><text x="26" y="649" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">A destruição da camada de</text><text x="26" y="673" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ozônio esteve ligada</text><text x="26" y="697" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">principalmente a substâncias</text><text x="26" y="721" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">destruidoras de ozônio, como</text><text x="26" y="745" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">CFCs; não é a mesma causa do</text><text x="26" y="769" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">aquecimento global.</text></svg>
