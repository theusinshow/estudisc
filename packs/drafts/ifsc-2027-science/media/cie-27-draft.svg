<svg xmlns="http://www.w3.org/2000/svg" width="360" height="893" viewBox="0 0 360 893" role="img" aria-labelledby="title description"><title id="title">Classificação dos seres vivos</title><desc id="description">Classificação dos seres vivos
Classificação biológica
Classificação biológica organiza organismos em grupos com base em características e, na sistemática moderna, relações evolutivas.
Espécie
Espécie é uma categoria básica de classificação; definições de espécie variam conforme o grupo e o problema científico.
Categorias taxonômicas
Categorias taxonômicas são hierárquicas, como espécie, gênero, família, ordem, classe, filo e reino em uma apresentação escolar tradicional.
Nomes científicos
Nomes científicos seguem convenções internacionais para reduzir ambiguidades entre idiomas e nomes populares.</desc><rect width="360" height="893" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Classificação dos seres</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">vivos</text><rect x="12" y="99" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Classificação biológica</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Classificação biológica</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">organiza organismos em grupos</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">com base em características e,</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">na sistemática moderna,</text><text x="26" y="259" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">relações evolutivas.</text><rect x="12" y="301" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="334" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Espécie</text><text x="26" y="365" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Espécie é uma categoria básica</text><text x="26" y="389" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">de classificação; definições</text><text x="26" y="413" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">de espécie variam conforme o</text><text x="26" y="437" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">grupo e o problema científico.</text><rect x="12" y="479" width="336" height="208" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="512" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Categorias taxonômicas</text><text x="26" y="543" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Categorias taxonômicas são</text><text x="26" y="567" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">hierárquicas, como espécie,</text><text x="26" y="591" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">gênero, família, ordem,</text><text x="26" y="615" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">classe, filo e reino em uma</text><text x="26" y="639" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">apresentação escolar</text><text x="26" y="663" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">tradicional.</text><rect x="12" y="705" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="738" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Nomes científicos</text><text x="26" y="769" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Nomes científicos seguem</text><text x="26" y="793" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">convenções internacionais para</text><text x="26" y="817" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">reduzir ambiguidades entre</text><text x="26" y="841" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">idiomas e nomes populares.</text></svg>
