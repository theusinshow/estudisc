<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1074" viewBox="0 0 360 1074" role="img" aria-labelledby="title description"><title id="title">Número atômico, número de massa, massa atômica e íons</title><desc id="description">Número atômico, número de massa, massa atômica e íons
Z = 15 · A = 31
Um átomo neutro possui Z = 15 e A = 31. Quantos prótons, nêutrons e elétrons ele possui?
15 prótons · 16 nêutrons
Número atômico Z é o número de prótons no núcleo e identifica o elemento químico.
Número de massa A é a soma de prótons e nêutrons do núcleo de um átomo ou isótopo.
O número de nêutrons pode ser obtido por A − Z quando A representa um número de massa inteiro.
15 elétrons
Em um átomo eletricamente neutro, o número de elétrons é igual ao número de prótons.
15 prótons, 16 nêutrons e 15 elétrons.
Cátion e ânion
Cátions possuem carga líquida positiva por perda de elétrons; ânions possuem carga líquida negativa por ganho de elétrons.</desc><rect width="360" height="1074" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Número atômico, número de</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">massa, massa atômica e</text><text x="22" y="108" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">íons</text><rect x="12" y="130" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Z = 15 · A = 31</text><text x="26" y="194" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Um átomo neutro possui Z = 15</text><text x="26" y="218" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">e A = 31. Quantos prótons,</text><text x="26" y="242" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">nêutrons e elétrons ele</text><text x="26" y="266" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">possui?</text><rect x="12" y="308" width="336" height="324" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="341" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">15 prótons · 16 nêutrons</text><text x="26" y="372" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Número atômico Z é o número de</text><text x="26" y="396" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">prótons no núcleo e identifica</text><text x="26" y="420" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">o elemento químico.</text><text x="26" y="454" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Número de massa A é a soma de</text><text x="26" y="478" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">prótons e nêutrons do núcleo</text><text x="26" y="502" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">de um átomo ou isótopo.</text><text x="26" y="536" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">O número de nêutrons pode ser</text><text x="26" y="560" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">obtido por A − Z quando A</text><text x="26" y="584" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">representa um número de massa</text><text x="26" y="608" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">inteiro.</text><rect x="12" y="650" width="336" height="194" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="683" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">15 elétrons</text><text x="26" y="714" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Em um átomo eletricamente</text><text x="26" y="738" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">neutro, o número de elétrons é</text><text x="26" y="762" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">igual ao número de prótons.</text><text x="26" y="796" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">15 prótons, 16 nêutrons e 15</text><text x="26" y="820" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">elétrons.</text><rect x="12" y="862" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="895" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Cátion e ânion</text><text x="26" y="926" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Cátions possuem carga líquida</text><text x="26" y="950" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">positiva por perda de</text><text x="26" y="974" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">elétrons; ânions possuem carga</text><text x="26" y="998" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">líquida negativa por ganho de</text><text x="26" y="1022" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">elétrons.</text></svg>
