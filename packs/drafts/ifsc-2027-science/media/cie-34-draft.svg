<svg xmlns="http://www.w3.org/2000/svg" width="360" height="787" viewBox="0 0 360 787" role="img" aria-labelledby="title description"><title id="title">Lamarck, Darwin e seleção natural</title><desc id="description">Lamarck, Darwin e seleção natural
Lamarck
Lamarck propôs transformação das espécies e relacionou mudanças ao uso e desuso e à herança de caracteres adquiridos em sua teoria histórica.
Darwin-Wallace
Darwin e Wallace destacaram variação entre indivíduos, hereditariedade e diferenças de sucesso reprodutivo como base da seleção natural.
Síntese moderna
Teorias científicas são avaliadas por evidências; genética posterior explicou mecanismos de herança desconhecidos por Darwin.</desc><rect width="360" height="787" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Lamarck, Darwin e seleção</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">natural</text><rect x="12" y="99" width="336" height="208" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Lamarck</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Lamarck propôs transformação</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">das espécies e relacionou</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">mudanças ao uso e desuso e à</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">herança de caracteres</text><text x="26" y="259" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">adquiridos em sua teoria</text><text x="26" y="283" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">histórica.</text><path d="M180 320v18m-6-6 6 6 6-6" fill="none" stroke="#102a43" stroke-width="2"/><rect x="12" y="349" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="382" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Darwin-Wallace</text><text x="26" y="413" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Darwin e Wallace destacaram</text><text x="26" y="437" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">variação entre indivíduos,</text><text x="26" y="461" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">hereditariedade e diferenças</text><text x="26" y="485" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">de sucesso reprodutivo como</text><text x="26" y="509" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">base da seleção natural.</text><path d="M180 546v18m-6-6 6 6 6-6" fill="none" stroke="#102a43" stroke-width="2"/><rect x="12" y="575" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="608" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Síntese moderna</text><text x="26" y="639" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Teorias científicas são</text><text x="26" y="663" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">avaliadas por evidências;</text><text x="26" y="687" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">genética posterior explicou</text><text x="26" y="711" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">mecanismos de herança</text><text x="26" y="735" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">desconhecidos por Darwin.</text></svg>
