<svg xmlns="http://www.w3.org/2000/svg" width="360" height="492" viewBox="0 0 360 492" role="img" aria-labelledby="title description"><title id="title">Consumo e uso consciente de energia elétrica</title><desc id="description">Consumo e uso consciente de energia elétrica
Para estimar consumo em kWh, converte-se a potência para kW e multiplica-se pelo tempo em horas.
1.000 W · 2 horas
Um aparelho de 1.000 W funciona por 2 horas. Desprezando variações, qual consumo de energia corresponde a esse uso?
2 kWh.</desc><rect width="360" height="492" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Consumo e uso consciente</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">de energia elétrica</text><rect x="12" y="99" width="336" height="129" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Para estimar consumo em kWh,</text><text x="26" y="156" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">converte-se a potência para kW</text><text x="26" y="180" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">e multiplica-se pelo tempo em</text><text x="26" y="204" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">horas.</text><rect x="12" y="246" width="336" height="218" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="279" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">1.000 W · 2 horas</text><text x="26" y="310" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Um aparelho de 1.000 W</text><text x="26" y="334" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">funciona por 2 horas.</text><text x="26" y="358" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Desprezando variações, qual</text><text x="26" y="382" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">consumo de energia corresponde</text><text x="26" y="406" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">a esse uso?</text><text x="26" y="440" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">2 kWh.</text></svg>
