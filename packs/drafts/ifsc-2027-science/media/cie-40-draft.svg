<svg xmlns="http://www.w3.org/2000/svg" width="360" height="944" viewBox="0 0 360 944" role="img" aria-labelledby="title description"><title id="title">Evolução estelar</title><desc id="description">Evolução estelar
Evolução estelar
Estrelas formam-se quando regiões de nuvens moleculares colapsam gravitacionalmente e aquecem até iniciar fusão nuclear.
Durante a sequência principal, estrelas como o Sol fundem hidrogênio em hélio no núcleo por grande parte de sua vida.
A massa inicial é um fator central que determina luminosidade, duração da vida e destino evolutivo da estrela.
Massa semelhante à do Sol
Estrelas de massa semelhante à do Sol evoluem para gigante vermelha e terminam como anã branca após perder camadas externas.
Estrelas muito massivas
Estrelas muito massivas podem sofrer colapso do núcleo e explosão de supernova, deixando estrela de nêutrons ou, em certos casos, buraco negro.</desc><rect width="360" height="944" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Evolução estelar</text><rect x="12" y="68" width="336" height="420" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="101" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Evolução estelar</text><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Estrelas formam-se quando</text><text x="26" y="156" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">regiões de nuvens moleculares</text><text x="26" y="180" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">colapsam gravitacionalmente e</text><text x="26" y="204" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">aquecem até iniciar fusão</text><text x="26" y="228" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">nuclear.</text><text x="26" y="262" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Durante a sequência principal,</text><text x="26" y="286" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">estrelas como o Sol fundem</text><text x="26" y="310" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">hidrogênio em hélio no núcleo</text><text x="26" y="334" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">por grande parte de sua vida.</text><text x="26" y="368" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">A massa inicial é um fator</text><text x="26" y="392" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">central que determina</text><text 