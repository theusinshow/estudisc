ons</text><text x="26" y="868" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ou, em certos casos, buraco</text><text x="26" y="892" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">negro.</text><path d="M180 488v9H5V812.0" fill="none" stroke="#102a43" stroke-width="2"/><path d="M5 598.0H12" fill="none" stroke="#102a43" stroke-width="2"/><path d="M5 812.0H12" fill="none" stroke="#102a43" stroke-width="2"/></svg>
