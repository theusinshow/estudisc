<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1095" viewBox="0 0 360 1095" role="img" aria-labelledby="title description"><title id="title">Métodos anticoncepcionais e ISTs</title><desc id="description">Métodos anticoncepcionais e ISTs
Preservativos
Preservativos funcionam como barreira e também reduzem o risco de transmissão de muitas ISTs quando usados corretamente.
Métodos hormonais
Métodos hormonais atuam principalmente sobre ovulação e muco cervical, mas não protegem de ISTs.
DIU e implante
DIU e implante são métodos de longa duração com mecanismos distintos; escolha deve considerar orientação em saúde e preferências da pessoa.
Métodos definitivos
Métodos definitivos, como vasectomia e laqueadura, requerem decisão informada e seguem critérios legais e de saúde.
Dupla proteção
Dupla proteção combina preservativo com outro método contraceptivo quando se busca prevenção de gravidez e de ISTs.</desc><rect width="360" height="1095" fill="#f4f7f9"/><text x="22" y="46" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">Métodos anticoncepcionais</text><text x="22" y="77" fill="#102a43" font-family="Arial, sans-serif" font-size="24" font-weight="700">e ISTs</text><rect x="12" y="99" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="132" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Preservativos</text><text x="26" y="163" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Preservativos funcionam como</text><text x="26" y="187" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">barreira e também reduzem o</text><text x="26" y="211" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">risco de transmissão de muitas</text><text x="26" y="235" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ISTs quando usados</text><text x="26" y="259" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">corretamente.</text><rect x="12" y="301" width="336" height="160" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="334" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Métodos hormonais</text><text x="26" y="365" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Métodos hormonais atuam</text><text x="26" y="389" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">principalmente sobre ovulação</text><text x="26" y="413" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">e muco cervical, mas não</text><text x="26" y="437" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">protegem de ISTs.</text><rect x="12" y="479" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="512" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">DIU e implante</text><text x="26" y="543" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">DIU e implante são métodos de</text><text x="26" y="567" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">longa duração com mecanismos</text><text x="26" y="591" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">distintos; escolha deve</text><text x="26" y="615" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">considerar orientação em saúde</text><text x="26" y="639" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">e preferências da pessoa.</text><rect x="12" y="681" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="714" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Métodos definitivos</text><text x="26" y="745" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Métodos definitivos, como</text><text x="26" y="769" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">vasectomia e laqueadura,</text><text x="26" y="793" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">requerem decisão informada e</text><text x="26" y="817" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">seguem critérios legais e de</text><text x="26" y="841" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">saúde.</text><rect x="12" y="883" width="336" height="184" rx="8" fill="#ffffff" stroke="#607d8b"/><text x="26" y="916" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="700">Dupla proteção</text><text x="26" y="947" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">Dupla proteção combina</text><text x="26" y="971" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">preservativo com outro método</text><text x="26" y="995" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">contraceptivo quando se busca</text><text x="26" y="1019" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">prevenção de gravidez e de</text><text x="26" y="1043" fill="#102a43" font-family="Arial, sans-serif" font-size="17" font-weight="400">ISTs.</text></svg>
